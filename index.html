<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>لوحة إدارة أكاديمية سنا</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    table { border-collapse: collapse; }
    .overflow-x-auto { position: relative; max-width: 100%; }
    th, td { border: 1px solid #9ca3af; padding: .35rem .5rem; text-align: start; }
    caption { text-align: start; font-weight: 700; padding: .25rem 0; }
  </style>
</head>
<body class="bg-white text-gray-900 text-base leading-relaxed">
<div x-data="dashboard()" class="max-w-6xl mx-auto p-4">

  <a href="#main" class="sr-only focus:not-sr-only underline">تخطَّ إلى المحتوى</a>

  <header class="mb-4">
    <h1 class="text-2xl font-bold">لوحة إدارة أكاديمية سنا</h1>
    <p x-show="token" x-cloak>دخلتَ باسم <strong x-text="who"></strong>.
      <button type="button" class="border border-gray-900 px-2 ms-1" @click="logout()">اخرج</button></p>
    <p x-show="test" x-cloak class="font-bold border-2 border-gray-900 p-2">وضع الاختبار: هذه بيانات مجلد الاختبار، لا بيانات الأكاديمية.</p>
    <p x-show="data" x-cloak>سنة <span x-text="data && data.year"></span>، وتاريخ اليوم <span x-text="data && data.today"></span>.</p>
  </header>

  <p id="status" role="status" aria-live="polite" class="mb-2 font-bold" x-text="status"></p>
  <!-- Always in the DOM (empty when there is no error), so focus can move to it at once. -->
  <p id="error" role="alert" tabindex="-1" class="mb-2 font-bold text-red-800"
     :class="error ? 'border-2 border-red-800 p-2' : ''" x-text="error ? 'خطأ: ' + error : ''"></p>

  <main id="main" tabindex="-1">
  <section x-show="!token" x-cloak aria-labelledby="login-h" class="mb-8 max-w-md">
    <h2 id="login-h" class="text-xl font-bold mb-2">الدخول</h2>
    <form @submit.prevent="login()" class="flex flex-col gap-3">
      <div>
        <label for="login-name" class="font-bold block">اسمك</label>
        <input id="login-name" type="text" x-model="loginName" required maxlength="40" autocomplete="name"
               aria-describedby="login-name-hint" class="border border-gray-700 p-1 w-full">
        <p id="login-name-hint">يُكتب اسمك مع كل تعديل تحفظه.</p>
      </div>
      <div>
        <label for="login-password" class="font-bold block">كلمة المرور</label>
        <input id="login-password" type="password" x-model="loginPassword" required autocomplete="current-password"
               class="border border-gray-700 p-1 w-full">
      </div>
      <button type="submit" class="border-2 border-gray-900 px-3 py-1 font-bold self-start" :disabled="busy">ادخل</button>
    </form>
  </section>

  <template x-if="data"><div>

    <!-- 1. Numbers -->
    <section id="numbers" aria-labelledby="numbers-h" class="mb-8">
      <h2 id="numbers-h" tabindex="-1" class="text-xl font-bold mb-2">
        <button type="button" class="text-start w-full" aria-controls="numbers-body"
                :aria-expanded="String(isOpen('numbers'))" @click="toggleSection('numbers')"><span aria-hidden="true" x-text="isOpen('numbers') ? '− ' : '+ '"></span>الأرقام</button>
      </h2>
      <div id="numbers-body" x-show="isOpen('numbers')">
      <!-- The year's totals are on the donors page (donors.html). -->
      <label for="month-select" class="font-bold">الشهر:</label>
      <select id="month-select" x-model="month" class="border border-gray-700 p-1 mb-2">
        <template x-for="m in months()" :key="m"><option :value="m" :selected="m === month" x-text="m"></option></template>
      </select>
      <div class="overflow-x-auto">
        <table class="text-sm">
          <caption x-text="'أرقام شهر ' + month"></caption>
          <thead><tr><th scope="col">المعلم</th><template x-for="h in NUMBER_COLUMNS" :key="h"><th scope="col" x-text="h"></th></template></tr></thead>
          <tbody>
            <template x-for="(row, i) in monthRows()" :key="i">
              <tr><th scope="row" x-text="row[2]"></th><template x-for="h in NUMBER_COLUMNS" :key="h">
                <td x-text="row[data.monthlyHeaders.indexOf(h)]"></td>
              </template></tr>
            </template>
          </tbody>
        </table>
      </div>
      </div>
    </section>

    <!-- 2. Halaqa reports: the teachers' sheets as they are (S-55) -->
    <section id="reports" aria-labelledby="reports-h" class="mb-8">
      <h2 id="reports-h" tabindex="-1" class="text-xl font-bold mb-2">
        <button type="button" class="text-start w-full" aria-controls="reports-body"
                :aria-expanded="String(isOpen('reports'))" @click="toggleSection('reports')"><span aria-hidden="true" x-text="isOpen('reports') ? '− ' : '+ '"></span>تقارير الحلقات</button>
      </h2>
      <div id="reports-body" x-show="isOpen('reports')">
      <p class="mb-2">صفوف شيتات المعلمين كما هي؛ وما حالته «مكرر» أو «لا يُحسب» لا يدخل في الحساب.</p>
      <p class="mb-2">تُعدَّل المدة وعدد الطلاب ويُحذف الصف حتى يثبت الشهر في خامس تاليه. والحذف لا يمس سجل الطلاب.</p>
      <div class="flex flex-wrap gap-4 mb-2 items-end">
        <div>
          <label for="rep-teacher" class="font-bold block">المعلم</label>
          <select id="rep-teacher" x-model="repTeacher" class="border border-gray-700 p-1">
            <option value="*" :selected="repTeacher === '*'">كل المعلمين</option>
            <template x-for="t in data.teachers" :key="t.name"><option :value="t.name" :selected="t.name === repTeacher" x-text="t.name"></option></template>
          </select>
        </div>
        <div>
          <label for="rep-month" class="font-bold block">الشهر</label>
          <select id="rep-month" x-model="repMonth" class="border border-gray-700 p-1">
            <template x-for="m in reportMonths()" :key="m"><option :value="m" :selected="m === repMonth" x-text="m"></option></template>
          </select>
        </div>
        <button type="button" class="border border-gray-900 px-2 py-1" :disabled="busy" @click="refreshReports()"
                aria-describedby="rep-refresh-hint">حدّث التقارير</button>
        <p id="rep-refresh-hint" class="w-full">تتجدد كل عشر دقائق، والزر يجددها الآن في نحو عشرين ثانية.</p>
      </div>
      <div class="overflow-x-auto" x-show="reportRows().length">
        <table class="text-sm">
          <caption x-text="'تقارير ' + (repTeacher === '*' ? 'كل المعلمين' : repTeacher) + ' في ' + repMonth"></caption>
          <thead><tr>
            <th scope="col" x-show="repTeacher === '*'">المعلم</th>
            <th scope="col">تاريخ التقرير</th><th scope="col">نوع الحلقة / الفترة</th><th scope="col">فئة الطلاب</th>
            <th scope="col">مدة الحصة</th><th scope="col">عدد الطلاب</th><th scope="col">ملاحظات الإدارة</th><th scope="col">الحالة</th>
            <th scope="col">إجراء</th>
          </tr></thead>
          <tbody>
            <template x-for="r in reportRows()" :key="r.order">
              <tr>
                <td x-show="repTeacher === '*'" x-text="r.teacher"></td>
                <th scope="row" x-text="r.date"></th>
                <td>
                  <a x-show="r.link" :href="r.link" target="_blank" rel="noopener" class="underline"
                     x-text="r.session" :aria-label="r.session + '، افتح التقرير (نافذة جديدة)'"></a>
                  <span x-show="!r.link" x-text="r.session"></span>
                </td>
                <td x-text="r.category"></td>
                <td x-text="r.duration"></td><td x-text="r.students"></td><td x-text="r.notes"></td><td x-text="r.status"></td>
                <td>
                  <span x-show="!r.editable">شهر ثابت</span>
                  <span x-show="r.editable && pendingReport !== r.order" class="flex gap-1">
                    <button type="button" class="border border-gray-900 px-2" :disabled="busy"
                            :aria-label="'عدّل تقرير ' + reportName(r)" @click="startEditReport(r)">عدّل</button>
                    <button type="button" class="border border-gray-900 px-2" :disabled="busy"
                            :aria-label="'احذف تقرير ' + reportName(r)" @click="askDeleteReport(r)">احذف</button>
                  </span>
                  <span x-show="r.editable && pendingReport === r.order" class="flex gap-1">
                    <button type="button" class="border-2 border-red-800 px-2 font-bold" :id="'rep-confirm-' + r.order" :disabled="busy"
                            :aria-label="'تأكيد حذف تقرير ' + reportName(r) + ' من الشيت؛ لا رجعة فيه'"
                            @click="deleteReport(r)">تأكيد الحذف</button>
                    <button type="button" class="border border-gray-900 px-2" :aria-label="'ألغِ حذف تقرير ' + reportName(r)"
                            @click="cancelDeleteReport(r)">ألغِ</button>
                  </span>
                </td>
              </tr>
            </template>
            <tr>
              <td x-show="repTeacher === '*'"></td>
              <th scope="row">الإجمالي</th><td></td><td></td>
              <td x-text="reportTotals().duration"></td><td x-text="reportTotals().students"></td><td></td>
              <td x-text="reportTotals().count + ' محسوباً'"></td><td></td>
            </tr>
            <tr>
              <td x-show="repTeacher === '*'"></td>
              <th scope="row">المتوسط</th><td></td><td></td>
              <td x-text="reportTotals().avgDuration"></td><td x-text="reportTotals().avgStudents"></td><td></td><td></td><td></td>
            </tr>
          </tbody>
        </table>
      </div>
      <p x-show="!reportRows().length">لا تقارير في هذا الشهر.</p>
      <form x-show="editing" @submit.prevent="saveReport()" class="border border-gray-700 p-3 mt-3 flex flex-col gap-2 max-w-md">
        <fieldset>
          <legend id="rep-edit-h" class="font-bold mb-2" x-text="editing ? 'تعديل تقرير ' + reportName(editing.r) : ''"></legend>
          <div class="flex flex-wrap gap-4">
            <div>
              <label for="rep-hours" class="block">ساعات الحصة</label>
              <input id="rep-hours" type="number" min="0" max="5" step="1" inputmode="numeric" x-model="editHours"
                     class="border border-gray-700 p-1 w-20" aria-describedby="rep-edit-hint">
            </div>
            <div>
              <label for="rep-minutes" class="block">دقائق الحصة</label>
              <input id="rep-minutes" type="number" min="0" max="59" step="1" inputmode="numeric" x-model="editMinutes"
                     class="border border-gray-700 p-1 w-20" aria-describedby="rep-edit-hint">
            </div>
            <div>
              <label for="rep-students" class="block">عدد الطلاب</label>
              <input id="rep-students" type="number" min="0" step="1" inputmode="numeric" x-model="editStudents"
                     class="border border-gray-700 p-1 w-20">
            </div>
          </div>
          <p id="rep-edit-hint" class="mt-1">مدة الحصة من دقيقة إلى خمس ساعات.</p>
        </fieldset>
        <div class="flex gap-2">
          <button type="submit" class="border-2 border-gray-900 px-3 py-1 font-bold" :disabled="busy">احفظ التعديل</button>
          <button type="button" class="border border-gray-900 px-3 py-1" @click="cancelEditReport()">ألغِ</button>
        </div>
      </form>
      </div>
    </section>

    <!-- 3. Students -->
    <section id="students" aria-labelledby="students-h" class="mb-8">
      <h2 id="students-h" tabindex="-1" class="text-xl font-bold mb-2">
        <button type="button" class="text-start w-full" aria-controls="students-body"
                :aria-expanded="String(isOpen('students'))" @click="toggleSection('students')"><span aria-hidden="true" x-text="isOpen('students') ? '− ' : '+ '"></span>الطلاب</button>
      </h2>
      <div id="students-body" x-show="isOpen('students')">
      <div class="flex flex-wrap gap-4 mb-2">
        <div>
          <label for="teacher-select" class="font-bold block">المعلم</label>
          <select id="teacher-select" x-model="teacher" class="border border-gray-700 p-1">
            <option value="*" :selected="teacher === '*'">كل المعلمين</option>
            <template x-for="t in data.teachers" :key="t.name"><option :value="t.name" :selected="t.name === teacher" x-text="t.name + ' (' + t.students.filter(s => isActive(s)).length + ')'"></option></template>
          </select>
        </div>
        <div>
          <label for="search" class="font-bold block">ابحث بالاسم</label>
          <input id="search" type="search" x-model="search" class="border border-gray-700 p-1" aria-describedby="search-count">
          <p id="search-count" x-text="filteredStudents().length + ' طالباً'"></p>
        </div>
        <div>
          <label for="absent-filter" class="font-bold block">اعرض</label>
          <select id="absent-filter" x-model="absentDays" class="border border-gray-700 p-1" aria-describedby="search-count">
            <option value="0">كل النشطين</option>
            <option value="14">الغائبين أكثر من 14 يوماً</option>
          </select>
        </div>
        <div>
          <label for="msg-month" class="font-bold block">شهر رسالة وليّ الأمر</label>
          <select id="msg-month" x-model="msgMonth" class="border border-gray-700 p-1">
            <template x-for="m in messageMonths()" :key="m"><option :value="m" :selected="m === msgMonth" x-text="m"></option></template>
          </select>
        </div>
      </div>
      <p class="mb-2" x-text="'هنا من حضر في آخر ' + activeDays() + ' يوماً؛ ومن غاب أكثر منها ففي قسم «الطلاب الغائبون».'"></p>
      <div class="overflow-x-auto">
        <table class="text-sm">
          <caption x-text="(absentDays === '0' ? 'الطلاب النشطون عند ' : 'الغائبون أكثر من ' + absentDays + ' يوماً من النشطين عند ') + teacherLabel() + '، الأحدث حضوراً أولاً'"></caption>
          <thead><tr>
            <th scope="col">الاسم</th><th scope="col" x-show="teacher === '*'">المعلم</th><th scope="col">الجنس</th><th scope="col">الفئة</th>
            <th scope="col">أول ظهور</th><th scope="col">آخر ظهور</th><th scope="col">أيام الغياب</th><th scope="col">الحضور</th>
            <th scope="col">آخر حفظ</th><th scope="col">الإعادة</th><th scope="col">الأوسمة</th><th scope="col">التكريمات</th>
            <th scope="col">السن</th><th scope="col">سنة الميلاد والهاتف</th>
          </tr></thead>
          <tbody>
            <template x-for="(s, i) in filteredStudents()" :key="k(s)">
              <tr>
                <th scope="row"><span x-text="s.name"></span><span x-show="s.isNew"> (جديد)</span></th>
                <td x-show="teacher === '*'" x-text="s.teacher"></td>
                <td>
                  <label :for="'g-' + i" class="sr-only">الجنس</label>
                  <select :id="'g-' + i" x-model="genders[k(s)]" class="border border-gray-700 p-1">
                    <option value="ذكر">ذكر</option><option value="أنثى">أنثى</option>
                  </select>
                </td>
                <td x-text="s.category"></td><td x-text="s.firstSeen"></td><td x-text="s.lastSeen"></td>
                <td x-text="daysAway(s)"></td>
                <td x-text="s.attendance"></td><td x-text="s.lastHifz"></td>
                <td x-text="s.repeats"></td><td x-text="s.medals"></td><td x-text="s.honors"></td>
                <td x-text="s.age === '' ? '' : s.age + ' سنة'"></td>
                <td>
                  <label :for="'by-' + i" class="sr-only">سنة الميلاد</label>
                  <input :id="'by-' + i" type="text" inputmode="numeric" maxlength="4" placeholder="سنة الميلاد"
                         x-model="details[k(s)].birthYear" class="border border-gray-700 p-1 w-24">
                  <label :for="'ph-' + i" class="sr-only">الهاتف</label>
                  <input :id="'ph-' + i" type="tel" dir="ltr" placeholder="+20…"
                         x-model="details[k(s)].phone" class="border border-gray-700 p-1 w-40">
                  <a x-show="s.phone" :href="waLink(s)" target="_blank" rel="noopener" class="underline ms-1"
                     :aria-label="'راسل ' + s.name + ' على WhatsApp' + (absentMessage(s) ? ' برسالة غياب جاهزة' : '') + ' (يفتح في نافذة جديدة)'"
                     x-text="absentMessage(s) ? 'WhatsApp برسالة غياب' : 'WhatsApp'"></a>
                  <a x-show="s.phone" :href="monthLink(s)" target="_blank" rel="noopener" class="underline ms-1"
                     :aria-label="'أرسل لوليّ أمر ' + s.name + ' خلاصة شهر ' + msgMonth + ' على WhatsApp (يفتح في نافذة جديدة)'">رسالة الشهر</a>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <p class="mt-2 flex flex-wrap gap-2 items-center">
        <button type="button" class="border border-gray-900 px-3 py-1 font-bold disabled:opacity-50"
                :disabled="busy || !changedStudents(true).length" aria-describedby="students-changed"
                @click="saveStudents(true)">احفظ الطلاب</button>
        <span id="students-changed" x-text="changedStudents(true).length ? 'تغيّر ' + changedStudents(true).length + ' طالباً' : 'لا تغيير'"></span>
        <button type="button" class="border border-gray-900 px-3 py-1" :disabled="!filteredStudents().length"
                aria-describedby="students-download-hint" @click="downloadStudents(filteredStudents(), 'الطلاب النشطون', teacherLabel())">نزّل القائمة</button>
        <span id="students-download-hint">ملف CSV يفتحه Excel، فيه ما يعرضه الجدول بعد البحث والتصفية.</span>
      </p>
      </div>
    </section>

    <!-- 3a. Students absent past ACTIVE_DAYS: out of the lists, still in the numbers -->
    <section id="absent" aria-labelledby="absent-h" class="mb-8">
      <h2 id="absent-h" tabindex="-1" class="text-xl font-bold mb-2">
        <button type="button" class="text-start w-full" aria-controls="absent-body"
                :aria-expanded="String(isOpen('absent'))" @click="toggleSection('absent')"><span aria-hidden="true" x-text="isOpen('absent') ? '− ' : '+ '"></span>الطلاب الغائبون</button>
      </h2>
      <div id="absent-body" x-show="isOpen('absent')">
      <p class="mb-2" x-text="'من غاب أكثر من ' + activeDays() + ' يوماً. لا يُحذف من السجل ولا من الأرقام، ويعود إلى قسم «الطلاب» من أول تقرير يرد فيه.'"></p>
      <div class="flex flex-wrap gap-4 mb-2">
        <div>
          <label for="abs-teacher" class="font-bold block">المعلم</label>
          <select id="abs-teacher" x-model="absTeacher" class="border border-gray-700 p-1">
            <option value="*" :selected="absTeacher === '*'">كل المعلمين</option>
            <template x-for="t in data.teachers" :key="t.name"><option :value="t.name" :selected="t.name === absTeacher" x-text="t.name + ' (' + t.students.filter(s => !isActive(s)).length + ')'"></option></template>
          </select>
        </div>
        <div>
          <label for="abs-search" class="font-bold block">ابحث بالاسم</label>
          <input id="abs-search" type="search" x-model="absSearch" class="border border-gray-700 p-1" aria-describedby="abs-count">
          <p id="abs-count" x-text="absentStudents().length + ' طالباً'"></p>
        </div>
      </div>
      <div class="overflow-x-auto" x-show="absentStudents().length">
        <table class="text-sm">
          <caption x-text="'الطلاب الغائبون عند ' + (absTeacher === '*' ? 'كل المعلمين' : absTeacher) + '، الأحدث حضوراً أولاً'"></caption>
          <thead><tr>
            <th scope="col">الاسم</th><th scope="col" x-show="absTeacher === '*'">المعلم</th><th scope="col">الجنس</th><th scope="col">الفئة</th>
            <th scope="col">أول ظهور</th><th scope="col">آخر ظهور</th><th scope="col">أيام الغياب</th><th scope="col">الحضور</th>
            <th scope="col">آخر حفظ</th><th scope="col">التكريمات</th><th scope="col">السن</th><th scope="col">سنة الميلاد والهاتف</th>
          </tr></thead>
          <tbody>
            <template x-for="(s, i) in absentStudents()" :key="k(s)">
              <tr>
                <th scope="row" x-text="s.name"></th>
                <td x-show="absTeacher === '*'" x-text="s.teacher"></td>
                <td>
                  <label :for="'ag-' + i" class="sr-only">الجنس</label>
                  <select :id="'ag-' + i" x-model="genders[k(s)]" class="border border-gray-700 p-1">
                    <option value="ذكر">ذكر</option><option value="أنثى">أنثى</option>
                  </select>
                </td>
                <td x-text="s.category"></td><td x-text="s.firstSeen"></td><td x-text="s.lastSeen"></td>
                <td x-text="daysAway(s)"></td><td x-text="s.attendance"></td><td x-text="s.lastHifz"></td><td x-text="s.honors"></td>
                <td x-text="s.age === '' ? '' : s.age + ' سنة'"></td>
                <td>
                  <label :for="'aby-' + i" class="sr-only">سنة الميلاد</label>
                  <input :id="'aby-' + i" type="text" inputmode="numeric" maxlength="4" placeholder="سنة الميلاد"
                         x-model="details[k(s)].birthYear" class="border border-gray-700 p-1 w-24">
                  <label :for="'aph-' + i" class="sr-only">الهاتف</label>
                  <input :id="'aph-' + i" type="tel" dir="ltr" placeholder="+20…"
                         x-model="details[k(s)].phone" class="border border-gray-700 p-1 w-40">
                  <a x-show="s.phone" :href="waLink(s)" target="_blank" rel="noopener" class="underline ms-1"

      <div class="overflow-x-auto">
        <table class="text-sm">
          <caption>آخر التعديلات، الأحدث أولاً</caption>
          <thead><tr><th scope="col">الوقت</th><th scope="col">الاسم</th><th scope="col">الفعل</th><th scope="col">التفاصيل</th></tr></thead>
          <tbody>
            <template x-for="(e, i) in data.log" :key="i">
              <tr><th scope="row" x-text="e.time"></th><td x-text="e.name"></td><td x-text="e.action"></td><td x-text="e.details"></td></tr>
            </template>
          </tbody>
        </table>
        <p x-show="!data.log.length">لا تعديلات بعد.</p>
      </div>
      </div>
    </section>
  </div></template>
  </main>
</div>

<script>
  // The /exec address of the script's versioned web app deployment (D4).
  const API_URL = 'https://script.google.com/macros/s/AKfycbwxv2ueJUqhNRX-rBSBGLqzm9ReKH59pWftoYi-cfRF7CdU8MK60XJZeyuKI2qhqm7I/exec';
  const SESSION_KEY = 'sana_dashboard_session';
  const ABSENT_MESSAGE_DAYS = 14;
  // Sections the admin opened, kept until the tab closes (U-06).
  const OPEN_KEY = 'sana_dashboard_open';
  // The monthly numbers the admin reads (U-05); the public file keeps every column.
  const NUMBER_COLUMNS = ['الطلاب الجدد', 'من حضر في الشهر', 'المستمرون من الشهر السابق',
    'نسبة الاستمرار', 'عدد الحلقات', 'الساعات', 'الحضور الكلي', 'متوسط الطلاب في الحلقة'];
  // A save may wait up to four minutes for a report being received (LOCK_TIMEOUT_MS).
  const SLOW_MS = 20000;
  // API.MAX_PAIRS: one save carries fifty students at most (U-03).
  const MAX_STUDENTS = 50;

  // In-page links move focus to the section heading (or <main>), so a screen
  // reader starts reading there.
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (!link) return;
    event.preventDefault();
    const target = document.getElementById(link.getAttribute('href').slice(1));
    if (!target) return;
    const heading = target.matches('section') ? target.querySelector('h2') : target;
    heading.scrollIntoView({ block: 'start' });
    heading.focus();
  });

  function dashboard() {
    return {
      data: null, status: '', error: '', busy: false, year: '', test: false,
      token: '', who: '', loginName: '', loginPassword: '',
      month: '', teacher: '', repTeacher: '*', repMonth: '', search: '', absentDays: '0', genders: {},
      details: {},
      aliasFrom: '', aliasMode: 'list', aliasToList: '', aliasToTyped: '', review: null, pendingDelete: -1,
      editing: null, editHours: '', editMinutes: '', editStudents: '', pendingReport: -1,
      honTeacher: '', honKey: '', honDate: '', honReason: '', honMonth: '', pendingHonor: -1, honorAmountInput: '',
      rates: {}, fixedAmounts: {}, payMonth: '', payPassword: '', payEditing: false,
      expMonth: '', expAmount: '',
      absTeacher: '*', absSearch: '', hisTeacher: '', hisKey: '', msgMonth: '',
      openSections: {}, NUMBER_COLUMNS,

      init() {
        try { this.openSections = JSON.parse(sessionStorage.getItem(OPEN_KEY) || '{}') || {}; }
        catch (e) { this.openSections = {}; }
        const params = new URLSearchParams(location.search);
        this.year = params.get('year') || String(new Date().getFullYear());
        this.test = params.get('test') === '1';
        let saved = null;
        try { saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { saved = null; }
        if (saved && saved.token) {
          this.token = saved.token;
          this.who = saved.who || '';
          this.status = 'جارٍ تحميل البيانات…';
          this.call('data', {}, () => this.landed('حُمّلت البيانات.'));
        } else {
          this.$nextTick(() => this.focusEl('login-name'));
        }
      },

      call(action, args, done) {
        this.busy = true;
        const slow = setTimeout(() => {
          if (this.busy) this.status = 'ما زال الطلب جارياً؛ انتظر ولا تُعِد الضغط.';
        }, SLOW_MS);
        this.error = '';
        fetch(API_URL, {
          method: 'POST',
          // text/plain keeps the request simple, so the browser sends no CORS preflight.
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, token: this.token, test: this.test, year: this.year, args: args || {} }),
        })
          .catch(() => { throw { network: true }; })
          // Google answers with an HTML page for a wrong address, a deployment
          // that needs authorizing, or a quota error: that is not the network.
          .then(r => r.text().then(text => {
            let reply = null;
            try { reply = JSON.parse(text); } catch (e) { reply = null; }
            if (!r.ok || !reply) throw { server: r.status };
            return reply;
          }))
          .then(reply => {
            this.busy = false;
            clearTimeout(slow);
            if (!reply.ok) return this.fail(reply.error, reply.auth);
            if (action === 'login') return done(reply);
            this.load(reply.data);
            this.status = typeof done === 'function' ? done(reply) : done;
          })
          .catch(err => {
            this.busy = false;
            clearTimeout(slow);
            if (err && err.network) this.fail('تعذّر الاتصال بالخادم؛ تحقق من الإنترنت ثم أعد المحاولة.');
            else if (err && err.server !== undefined) this.fail('ردّ الخادم ردّاً غير متوقع (الحالة ' + err.server + ')؛ أخبر المطور.');
            else this.fail('خطأ في الصفحة: ' + ((err && err.message) || err));
          });
      },
      fail(message, auth) {
        this.status = '';
        this.error = message || 'خطأ غير معروف.';
        if (auth) this.forget();
        this.$nextTick(() => this.focusEl('error'));
      },
      forget() {
        this.token = '';
        this.data = null;
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* private window */ }
      },

      login() {
        this.call('login', { name: this.loginName, password: this.loginPassword }, reply => {
          this.token = reply.token;
          this.who = reply.name;
          this.loginPassword = '';
          try {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({ token: reply.token, who: reply.name }));
          } catch (e) { /* private window: the session lasts until reload */ }
          this.status = 'جارٍ تحميل البيانات…';
          this.call('data', {}, () => this.landed('دخلتَ باسم ' + reply.name + '، وحُمّلت البيانات.'));
        });
      },
      // The login form hides under the focused button, so focus goes to the first
      // heading once the data has rendered; the status line still announces the result.
      landed(message) {
        this.focusSoon('numbers-h');
        return message;
      },
      logout() {
        this.forget();
        this.error = '';
        this.status = 'خرجتَ من اللوحة.';
        this.$nextTick(() => this.focusEl('login-name'));
      },

      load(data) {
        this.data = data;
        this.genders = {};
        this.details = {};
        data.teachers.forEach(t => t.students.forEach(s => {
          s.teacher = t.name;
          this.genders[t.name + '|' + s.key] = s.gender;
          this.details[t.name + '|' + s.key] = { birthYear: String(s.birthYear || ''), phone: s.phone || '' };
        }));
        if (this.teacher !== '*' && !data.teachers.some(t => t.name === this.teacher)) this.teacher = data.teachers.length ? data.teachers[0].name : '';
        if (this.repTeacher !== '*' && !data.teachers.some(t => t.name === this.repTeacher)) this.repTeacher = '*';
        const repMonths = this.reportMonths();
        if (repMonths.indexOf(this.repMonth) === -1) this.repMonth = repMonths.length ? repMonths[repMonths.length - 1] : '';
        const months = this.months();
        if (months.indexOf(this.month) === -1) this.month = months.length ? months[months.length - 1] : '';
        if (!this.expMonth) {
          const now = new Date();
          const current = String(now.getFullYear()) === this.year ? now.getMonth() + 1 : 1;
          this.expMonth = this.year + '-' + String(current).padStart(2, '0');
        }
        this.expAmount = this.expenseOf(this.expMonth);
        if (!data.payOpen) this.payEditing = false;
        this.rates = {};
        data.teachers.forEach(t => { this.rates[t.name] = String(t.rate); });
        this.fixedAmounts = {};
        (data.fixed || []).forEach(f => { this.fixedAmounts[f.item] = String(f.amount); });
        const payMonths = this.payMonths();
        if (payMonths.indexOf(this.payMonth) === -1) this.payMonth = payMonths.length ? payMonths[payMonths.length - 1] : '';
        this.pendingDelete = -1;
        this.editing = null;
        this.pendingReport = -1;
        if (!data.teachers.some(t => t.name === this.honTeacher)) this.honTeacher = data.teachers.length ? data.teachers[0].name : '';
        if (!this.honDate) this.honDate = data.today;
        if (this.honorMonths().indexOf(this.honMonth) === -1) this.honMonth = data.today.slice(0, 7);
        this.pendingHonor = -1;
        this.honorAmountInput = String(data.honorAmount || '');
        if (this.absTeacher !== '*' && !data.teachers.some(t => t.name === this.absTeacher)) this.absTeacher = '*';
        if (!data.teachers.some(t => t.name === this.hisTeacher)) {
          this.hisTeacher = data.teachers.length ? data.teachers[0].name : '';
          this.hisKey = '';
        }
        const msgMonths = this.messageMonths();
        if (msgMonths.indexOf(this.msgMonth) === -1) {
          this.msgMonth = msgMonths.length > 1 ? msgMonths[msgMonths.length - 2] : (msgMonths[0] || '');
        }
      },

      reportMonths() {
        return this.data ? Array.from(new Set(this.data.reports.map(r => r.month))).sort() : [];
      },
      // Newest first: by date, then the later row of the sheet (the later report), then teacher.
      reportRows() {
        if (!this.data) return [];
        const rows = this.data.reports.filter(r => r.month === this.repMonth
          && (this.repTeacher === '*' || r.teacher === this.repTeacher));
        const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
        return rows.sort((a, b) => cmp(b.day, a.day) || b.order - a.order || cmp(a.teacher, b.teacher));
      },
      // Over the counted rows only, so the totals match the numbers and the pay.
      reportTotals() {
        const rows = this.reportRows().filter(r => !r.status);
        const minutes = rows.reduce((a, r) => a + r.minutes, 0);
        const students = rows.reduce((a, r) => a + r.attendance, 0);
        const hm = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
        return {
          count: rows.length, duration: hm(minutes), students,
          avgDuration: rows.length ? hm(Math.round(minutes / rows.length)) : '',
          avgStudents: rows.length ? Math.round(students / rows.length * 10) / 10 : '',
        };
      },
      reportName(r) {
        return r.teacher + '، ' + r.date + '، ' + r.session;
      },
      reportRef(r) {
        return { teacher: r.teacher, month: r.month, row: r.row, stamp: r.stamp };
      },
      startEditReport(r) {
        this.pendingReport = -1;
        this.editing = { r };
        this.editHours = String(Math.floor(r.minutes / 60));
        this.editMinutes = String(r.minutes % 60);
        this.editStudents = String(r.attendance);
        this.$nextTick(() => this.focusEl('rep-hours'));
      },
      cancelEditReport() {
        this.editing = null;
        this.status = 'أُلغي التعديل.';
        this.$nextTick(() => this.focusEl('reports-h'));
      },
      saveReport() {
        const r = this.editing.r;
        const args = Object.assign(this.reportRef(r),
          { hours: this.editHours, minutes: this.editMinutes, students: this.editStudents });
        this.call('editReport', args, () => {
          this.focusSoon('reports-h');
          return 'عُدِّل تقرير ' + this.reportName(r) + '.';
        });
      },
      askDeleteReport(r) {
        this.editing = null;
        this.pendingReport = r.order;
        this.$nextTick(() => this.focusEl('rep-confirm-' + r.order));
      },
      cancelDeleteReport(r) {
        this.pendingReport = -1;
        this.status = 'لم يُحذف التقرير.';
        this.$nextTick(() => this.focusEl('reports-h'));
      },
      deleteReport(r) {
        this.call('deleteReport', this.reportRef(r), () => {
          this.focusSoon('reports-h');
          return 'حُذف تقرير ' + this.reportName(r) + ' من الشيت.';
        });
      },
      refreshReports() {
        this.status = 'جارٍ قراءة الشيتات…';
        this.call('refreshReports', {}, 'حُدّثت التقارير من الشيتات.');
      },
      months() {
        return this.data ? Array.from(new Set(this.data.monthly.map(r => r[0]))).sort() : [];
      },
      isOpen(id) {
        return this.openSections[id] === true;
      },
      toggleSection(id) {
        this.openSections[id] = !this.isOpen(id);
        try { sessionStorage.setItem(OPEN_KEY, JSON.stringify(this.openSections)); }
        catch (e) { /* private window: sections close on reload */ }
      },
      monthRows() {
        return this.data ? this.data.monthly.filter(r => r[0] === this.month) : [];
      },
      currentStudents() {
        if (!this.data) return [];
        if (this.teacher === '*') {
          return [].concat(...this.data.teachers.map(t => t.students))
            .sort((a, b) => (a.lastSeen < b.lastSeen ? 1 : a.lastSeen > b.lastSeen ? -1 : 0));
        }
        const t = this.data.teachers.find(x => x.name === this.teacher);
        return t ? t.students : [];
      },
      teacherLabel() {
        return this.teacher === '*' ? 'كل المعلمين' : this.teacher;
      },
      // S-45: past ABSENT_MESSAGE_DAYS the link carries a ready message, which the admin sends by hand.
      absentMessage(s) {
        const days = this.daysAway(s);
        if (days === '' || days <= ABSENT_MESSAGE_DAYS) return '';
        const she = s.gender === 'أنثى';
        const rest = days % 100;
        const word = rest >= 3 && rest <= 10 ? 'أيام' : (rest === 0 ? 'يوم' : 'يوماً');
        return 'السلام عليكم ورحمة الله، افتقدنا ' + s.name + ' في حلقات أكاديمية سنا منذ ' + days + ' ' + word
          + '، نرجو أن ' + (she ? 'تكون' : 'يكون') + ' بخير، ونسعد بعودت' + (she ? 'ها' : 'ه') + '.';
      },
      waLink(s) {
        const url = 'https://wa.me/' + String(s.phone).replace(/\D/g, '');
        const text = this.absentMessage(s);
        return text ? url + '?text=' + encodeURIComponent(text) : url;
      },
      // Same matching key as the registry (studentNameKey), so «فاطمه» finds «فاطمة».
      nameKey(name) {
        return String(name || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
          .replace(/[ً-ْٰـ\s]/g, '');
      },
      daysAway(s) {
        if (!s.lastSeen || !this.data) return '';
        return Math.round((Date.parse(this.data.today) - Date.parse(s.lastSeen)) / 86400000);
      },
      // PUBLIC_STATS.ACTIVE_DAYS, sent by the script.
      activeDays() {
        return (this.data && this.data.activeDays) || 30;
      },
      // Seen in the last activeDays days. A student with no date stays in view, so no row hides unnoticed.
      isActive(s) {
        const days = this.daysAway(s);
        return days === '' || days <= this.activeDays();
      },
      // The active students only; the absent ones have their own section.
      filteredStudents() {
        const q = this.nameKey(this.search);
        const min = Number(this.absentDays);
        return this.currentStudents().filter(s => this.isActive(s)
          && (!q || this.nameKey(s.name).indexOf(q) !== -1) && (!min || this.daysAway(s) > min));
      },
      absentStudents() {
        if (!this.data) return [];
        const q = this.nameKey(this.absSearch);
        return [].concat(...this.data.teachers.filter(t => this.absTeacher === '*' || t.name === this.absTeacher)
          .map(t => t.students))
          .filter(s => !this.isActive(s) && (!q || this.nameKey(s.name).indexOf(q) !== -1))
          .sort((a, b) => (a.lastSeen < b.lastSeen ? 1 : a.lastSeen > b.lastSeen ? -1 : 0));
      },
      // The list as the admin sees it, with every column, for Excel: UTF-8 with a BOM.
      downloadStudents(list, title, teacherName) {
        const head = ['الاسم', 'المعلم', 'الجنس', 'الفئة', 'السن', 'سنة الميلاد', 'الهاتف', 'أول ظهور', 'آخر ظهور',
          'أيام الغياب', 'الحضور', 'آخر حفظ', 'الأوسمة', 'التكريمات'];
        const rows = list.map(s => [s.name, s.teacher, s.gender, s.category, s.age, s.birthYear, s.phone,
          s.firstSeen, s.lastSeen, this.daysAway(s), s.attendance, s.lastHifz, s.medals, s.honors]);
        // A leading tab keeps a phone from becoming a number, and a cell from being read as a formula.
        const cell = v => {
          let text = String(v === undefined || v === null ? '' : v);
          if (/^[=+\-@]/.test(text) || /^\d{8,}$/.test(text)) text = '\t' + text;
          return '"' + text.replace(/"/g, '""') + '"';
        };
        const csv = '﻿' + [head].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
        const name = title + ' - ' + teacherName + ' - ' + this.data.today + '.csv';
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        this.status = 'نُزّل الملف «' + name + '»، وفيه ' + list.length + ' طالباً.';
      },

      historyStudents() {
        const t = this.data ? this.data.teachers.find(x => x.name === this.hisTeacher) : null;
        return t ? t.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'ar')) : [];
      },
      historyName() {
        const s = this.historyStudents().find(x => x.key === this.hisKey);
        return s ? s.name : '';
      },
      // Each of the student's last halaqat, with the link of its row in «تقارير الحلقات»:
      // the same teacher, day and session label as the sheet writes it (_sessionLabel).
      historyRows() {
        const s = this.historyStudents().find(x => x.key === this.hisKey);
        if (!s) return [];
        return (s.recent || []).map(h => {
          const label = h.num ? h.session + ' (حلقة ' + h.num + ')' : h.session;
          const rows = this.data.reports.filter(r => r.teacher === this.hisTeacher && r.day === h.day && r.session === label);
          const best = rows.find(r => !r.status && r.link) || rows.find(r => r.link);
          return { slot: h.day + '|' + h.session + '|' + h.num, day: h.day, session: h.session, num: h.num,
            link: best ? best.link : '' };
        });
      },

      // The year's months up to this one; the page starts on the last month.
      messageMonths() {
        if (!this.data) return [];
        const now = this.data.today.slice(0, 7);
        return this.yearMonths().filter(m => m <= now);
      },
      monthName(month) {
        const names = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر',
          'نوفمبر', 'ديسمبر'];
        return names[Number(month.slice(5, 7)) - 1] + ' ' + month.slice(0, 4);
      },
      // The month's summary for a parent (Kamal, 2026-10-29); the admin reviews and sends it by hand.
      monthMessage(s, month) {
        const she = s.gender === 'أنثى';
        const count = (s.months && s.months[month]) || 0;
        const rest = count % 100;
        const halaqat = count === 1 ? 'حلقة واحدة' : count === 2 ? 'حلقتين'
          : count + (rest >= 3 && rest <= 10 ? ' حلقات' : rest >= 11 ? ' حلقةً' : ' حلقة');
        const lines = ['السلام عليكم ورحمة الله، هذه خلاصة شهر ' + this.monthName(month) + ' لـ' + s.name + ':'];
        lines.push(count ? (she ? 'حضرت ' : 'حضر ') + halaqat + '.' : (she ? 'لم تحضر' : 'لم يحضر') + ' حلقة في هذا الشهر.');
        // Memorization is kept per student, not per halaqa: a later one would not belong to this month.
        if (s.lastHifz && s.lastHifzDate && s.lastHifzDate.slice(0, 7) <= month) lines.push((she ? 'آخر ما حفظت: ' : 'آخر ما حفظ: ') + s.lastHifz + '.');
        const honors = this.data.honors.filter(h => h.teacher === s.teacher && h.key === s.key && h.month === month).length;
        if (honors) {
          lines.push((she ? 'ونالت ' : 'ونال ') + (honors === 1 ? 'تكريماً' : honors === 2 ? 'تكريمين' : honors + ' تكريمات')
            + ' من الأكاديمية.');
        }
        lines.push('نسأل الله ' + (she ? 'لها' : 'له') + ' التوفيق.', 'أكاديمية سنا');
        return lines.join('\n');
      },
      monthLink(s) {
        return 'https://wa.me/' + String(s.phone).replace(/\D/g, '') + '?text=' + encodeURIComponent(this.monthMessage(s, this.msgMonth));
      },
      // A select, not <input type="month">, which screen readers announce as bare spin buttons.
      yearMonths() {
        return Array.from({ length: 12 }, (_, i) => this.year + '-' + String(i + 1).padStart(2, '0'));
      },
      // Pay rows reach the page only after the pay password (S-47).
      payData() {
        return (this.data && this.data.pay) || [];
      },
      unlockPay() {
        this.call('unlockPay', { password: this.payPassword }, reply => {
          this.payPassword = '';
          this.focusSoon('rates-h');
          return 'فُتحت الرواتب حتى ' + reply.data.payUntil + '.';
        });
      },
      lockPay() {
        this.call('lockPay', {}, () => {
          this.focusSoon('pay-password');
          return 'أُقفلت الرواتب.';
        });
      },
      payMonths() {
        return Array.from(new Set(this.payData().map(p => p.month))).sort();
      },
      payRows() {
        return this.payData().filter(p => p.month === this.payMonth);
      },
      payTotal() {
        const rows = this.payRows();
        const hours = Math.round(rows.reduce((a, p) => a + p.hours, 0) * 100) / 100;
        const unpriced = rows.some(p => p.pay === '');
        return { hours, pay: unpriced ? 'ناقص: بعضهم بلا سعر' : rows.reduce((a, p) => a + p.pay, 0) };
      },
      // For an element that x-show reveals only after this update has painted.
      focusSoon(id) {
        this.$nextTick(() => requestAnimationFrame(() => setTimeout(() => this.focusEl(id), 0)));
      },
      focusEl(id) {
        const el = document.getElementById(id);
        if (el) el.focus();
      },

      // Per teacher and student: two teachers may each have a student of the same name.
      k(s) {
        return s.teacher + '|' + s.key;
      },
      // Every student whose gender, birth year or phone differs from the sheet, in all teachers (U-03),
      // the active ones or the absent ones: each section saves its own.
      changedStudents(active) {
        if (!this.data) return [];
        const out = [];
        this.data.teachers.forEach(t => t.students.forEach(s => {
          const d = this.details[this.k(s)];
          if (!d || this.isActive(s) !== active) return;
          if (this.genders[this.k(s)] !== s.gender || d.birthYear.trim() !== String(s.birthYear || '')
            || d.phone.trim() !== (s.phone || '')) out.push(s);
        }));
        return out;
      },
      saveStudents(active) {
        const list = this.changedStudents(active);
        if (list.length > MAX_STUDENTS) {
          return this.fail('تغيّر ' + list.length + ' طالباً، ويُحفظ ' + MAX_STUDENTS
            + ' في المرة على الأكثر؛ أعد بعض الخانات كما كانت، واحفظ، ثم غيّرها.');
        }
        const args = {};
        list.forEach((s, i) => {
          const d = this.details[this.k(s)];
          Object.assign(args, { ['t' + i]: s.teacher, ['k' + i]: s.key, ['g' + i]: this.genders[this.k(s)],
            ['b' + i]: d.birthYear, ['p' + i]: d.phone });
        });
        this.call('saveStudents', args, 'حُفظت بيانات ' + list.length + ' طالباً.');
      },

      aliasTo() {
        return (this.aliasMode === 'list' ? this.aliasToList : this.aliasToTyped).trim();
      },
      reviewAlias() {
        const to = this.aliasTo();
        if (!this.aliasFrom || !to) {
          this.error = 'اختر الاسم الخطأ والاسم الصحيح.';
          this.$nextTick(() => this.focusEl('error'));
          return;
        }
        const list = this.currentStudents();
        this.review = {
          from: list.find(s => s.name === this.aliasFrom),
          to: list.find(s => s.name === to) || null,
          toName: to,
        };
        this.$nextTick(() => this.focusEl('alias-review'));
      },
      reviewText() {
        const r = this.review;
        const row = s => 'حضر ' + s.attendance + ' مرة، من ' + s.firstSeen + ' إلى ' + s.lastSeen;
        const from = '«' + r.from.name + '» (' + row(r.from) + ')';
        return r.to
          ? 'سيُدمج ' + from + ' في «' + r.to.name + '» (' + row(r.to) + ')، ويبقى جنس الصحيح وخاناته.'
          : 'لا صف باسم «' + r.toName + '»، فيُعاد تسمية ' + from + ' إليه.';
      },
      confirmAlias() {
        const alias = { teacher: this.teacher, from: this.review.from.name, to: this.review.toName };
        this.review = null;
        this.call('applyAlias', alias, result => {
          this.aliasFrom = ''; this.aliasToList = ''; this.aliasToTyped = '';
          const word = { merged: 'دُمج', renamed: 'أُعيدت تسمية', absent: 'لم يوجد' }[result.outcome] || result.outcome;
          return word + ' «' + alias.from + '» ← «' + alias.to + '». ويُطبَّق البديل على التقارير الآتية.';
        });
      },
      deleteAlias(a) {
        this.call('deleteAlias', { teacher: a.teacher, from: a.from }, 'حُذف البديل «' + a.from + '».');
      },

      // A blank rate is no change: a rate is never cleared from here.
      changedRates() {
        if (!this.data) return [];
        return this.data.teachers
          .map(t => ({ name: t.name, value: (this.rates[t.name] || '').trim(), old: String(t.rate) }))
          .filter(r => r.value !== '' && r.value !== r.old);
      },
      changedFixed() {
        if (!this.data) return [];
        return (this.data.fixed || [])
          .map(f => ({ name: f.item, value: (this.fixedAmounts[f.item] || '').trim(), old: String(f.amount) }))
          .filter(r => r.value !== r.old);
      },
      // A blank amount is no change: the amount is never cleared from here.
      changedHonorAmount() {
        const amount = this.honorAmountInput.trim();
        return this.data && amount !== '' && amount !== String(this.data.honorAmount) ? amount : '';
      },
      // The month's other expenses as saved, '' when none; they come only with the pay open.
      expenseOf(month) {
        const e = this.data && this.data.expenses.find(x => x.month === month);
        return e ? String(e.amount) : '';
      },
      // A blank amount is no change: an expense is never cleared from here.
      changedExpense() {
        const amount = this.expAmount.trim();
        return amount !== '' && amount !== this.expenseOf(this.expMonth) ? amount : '';
      },
      payChanged() {
        return this.changedRates().length > 0 || this.changedFixed().length > 0 || this.changedHonorAmount() !== ''
          || this.changedExpense() !== '';
      },
      togglePayEdit() {
        this.payEditing = !this.payEditing;
        if (this.payEditing) this.focusSoon('rate-0');
      },
      // The whole pay section in one request (U-02); the server saves all or none.
      savePay() {
        const rates = this.changedRates();
        const fixed = this.changedFixed();
        const amount = this.changedHonorAmount();
        const expense = this.changedExpense();
        if (!rates.length && !fixed.length && !amount && !expense) return;
        const args = {};
        rates.forEach((r, i) => { args['rn' + i] = r.name; args['rv' + i] = r.value; });
        fixed.forEach((r, i) => { args['fn' + i] = r.name; args['fv' + i] = r.value; });
        if (amount) args.honorAmount = amount;
        if (expense) { args.em = this.expMonth; args.ea = expense; }
        const said = [];
        if (rates.length) said.push('الأسعار: ' + rates.map(r => r.name + ' ' + r.value).join('، ') + ' جنيهاً للساعة');
        if (fixed.length) said.push('المصروفات الثابتة: ' + fixed.map(r => r.name + ' ' + (r.value || 'لا مبلغ')).join('، '));
        if (amount) said.push('مبلغ التكريم: ' + amount + ' جنيهاً من هذا الشهر');
        if (expense) said.push('المصروفات الأخرى لشهر ' + this.expMonth + ': ' + expense + ' جنيهاً');
        this.call('savePay', args, () => {
          this.payEditing = false;
          this.focusSoon('pay-edit-toggle');
          return 'حُفظت ' + said.join('؛ و') + '.';
        });
      },
      honorStudents() {
        const t = this.data ? this.data.teachers.find(x => x.name === this.honTeacher) : null;
        return t ? t.students.filter(s => this.isActive(s)).sort((a, b) => a.name.localeCompare(b.name, 'ar')) : [];
      },
      honorMonths() {
        if (!this.data) return [];
        return Array.from(new Set(this.data.honors.map(h => h.month).concat([this.data.today.slice(0, 7)]))).sort();
      },
      honorRows() {
        return this.data ? this.data.honors.filter(h => h.month === this.honMonth) : [];
      },
      // Over the year, most first; a tie goes by name.
      honorRanking() {
        if (!this.data) return [];
        const by = {};
        this.data.honors.forEach(h => {
          const id = h.teacher + '|' + h.key;
          (by[id] = by[id] || { teacher: h.teacher, key: h.key, name: h.name, count: 0 }).count++;
        });
        return Object.values(by).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ar'));
      },
      addHonor() {
        const s = this.honorStudents().find(x => x.key === this.honKey);
        if (!s) {
          this.error = 'اختر الطالب.';
          this.$nextTick(() => this.focusEl('error'));
          return;
        }
        const date = this.honDate.trim();
        this.call('addHonor', { teacher: this.honTeacher, key: s.key, date, reason: this.honReason }, () => {
          this.honReason = '';
          this.honMonth = date.slice(0, 7);
          return 'سُجّل تكريم ' + s.name + ' في ' + date + '.';
        });
      },
      askDeleteHonor(h) {
        this.pendingHonor = h.row;
        this.$nextTick(() => this.focusEl('hon-confirm-' + h.row));
      },
      cancelDeleteHonor() {
        this.pendingHonor = -1;
        this.status = 'لم يُحذف التكريم.';
        this.$nextTick(() => this.focusEl('honors-h'));
      },
      deleteHonor(h) {
        this.call('deleteHonor', { row: h.row, date: h.date, teacher: h.teacher, key: h.key }, () => {
          this.focusSoon('honors-h');
          return 'حُذف تكريم ' + h.name + ' في ' + h.date + '.';
        });
      },
    };
  }
</script>
